 { key: 'legalForm',       conf: d.legalForm_confidence       },\n  { key: 'iban',            conf: d.iban_confidence            },\n  { key: 'accountHolder',   conf: d.accountHolder_confidence   },\n  { key: 'bankCode',        conf: d.bankCode_confidence        },\n  { key: 'bankAccount',     conf: d.bankAccount_confidence     },\n  { key: 'bankCountry',     conf: d.bankCountry_confidence     }\n];\n\nvar existing = document.getElementById(styleId);\nif (existing) { existing.remove(); }\n\nvar css = [\n  '.formio-component .input-group { border-radius: 6px !important; border: 1.5px solid #ccc !important; overflow: hidden; background-color: white !important; }',\n  '.formio-component .form-control { border: none !important; background-color: transparent !important; box-shadow: none !important; }',\n  '.formio-component .input-group-addon { border: none !important; background-color: transparent !important; padding-right: 0 !important; font-size: 1.1em; }',\n  '.btn-primary { background-color: #f0f0f0 !important; border: 1px solid #d1d1d1 !important; color: #777 !important; padding: 8px 30px !important; float: right; }'\n].join(' ');\n\nfields.forEach(function(f) {\n  var c = confidenceColor(f.conf);\n  css += ' .formio-component-' + f.key + ' .input-group { border-color: ' + c.border + ' !important; background-color: ' + c.bg + ' !important; }';\n  css += ' .formio-component-' + f.key + ' i { color: ' + c.icon + ' !important; }';\n});\n\nvar el = document.createElement('style');\nel.id = styleId;\nel.innerHTML = css;\ndocument.head.appendChild(el);\n\nshow = false;",

                  ]

                    { "key": "city", "type": "textfield", "input": true, "label": "City", "prefix": "<i class='fa fa-android'></i>", "tableView": true }
                  ]

                {
                  "size": "md", "width": 4, "currentWidth": 4,
                  "components": [
                    { "key": "country_confidence", "type": "textfield", "input": true, "label": "Country — Confidence", "hidden": true, "tableView": false },
                    { "key": "country", "type": "textfield", "input": true, "label": "Country", "prefix": "<i class='fa fa-android'></i>", "tableView": true }
                  ]
                }
              ],
              "tableView": false
            },
            {

              "type": "columns",
              "input": false,
              "label": "Columns",
              "columns": [
                {
                  "pull": 0, "push": 0, "size": "md", "width": 6, "offset": 0, "currentWidth": 6,
                  "components": [

                  ]
                }
              ],
              "tableView": false
            }
          ]
        },
        {
          "key": "taxLegalPanel",
          "type": "panel",
          "input": false,
          "label": "Tax & Legal",
          "title": "<strong>⚖️ Tax & Legal</strong>",
          "tableView": false,
          "components": [
            {
              "key": "taxRow1",
              "type": "columns",
              "input": false,
              "label": "Columns",
              "columns": [
                {
                  "pull": 0, "push": 0, "size": "md", "width": 4, "offset": 0, "currentWidth": 4,
                  "components": [
                    { "key": "vatId_confidence", "type": "textfield", "input": true, "label": "VAT ID — Confidence", "hidden": true, "tableView": false },
                    { "key": "vatId", "type": "textfield", "input": true, "label": "VAT ID", "prefix": "<i class='fa fa-android'></i>", "tableView": true }

                  ]

                {
                  "pull": 0, "push": 0, "size": "md", "width": 6, "offset": 0, "currentWidth": 6,
                  "components": [
                    { "key": "legalForm_confidence", "type": "textfield", "input": true, "label": "Legal Form — Confidence", "hidden": true, "tableView": false },
                    { "key": "legalForm", "type": "textfield", "input": true, "label": "Legal Form", "prefix": "<i class='fa fa-android'></i>", "tableView": true }

        },
        {

          "type": "panel",
          "input": false,
          "label": "Banking & Payments",
          "title": "<strong>💳 Banking & Payments</strong>",
          "tableView": false,
          "components": [
            {
              "key": "bankingRow1",
              "type": "columns",
              "input": false,
              "label": "Columns",
              "columns": [
                {

                  "components": [

                    { "key": "iban", "type": "textfield", "input": true, "label": "IBAN", "prefix": "<i class='fa fa-android'></i>", "tableView": true }
                  ]
                },
                {
                  "pull": 0, "push": 0, "size": "md", "width": 6, "offset": 0, "currentWidth": 6,
                  "components": [
                    { "key": "accountHolder_confidence", "type": "textfield", "input": true, "label": "Account Holder — Confidence", "hidden": true, "tableView": false },
                    { "key": "accountHolder", "type": "textfield", "input": true, "label": "Account Holder", "prefix": "<i class='fa fa-android'></i>", "tableView": true }

                {

                  "components": [

                    { "key": "bankCode", "type": "textfield", "input": true, "label": "Bank Code", "prefix": "<i class='fa fa-android'></i>", "tableView": true }
                  ]
                },
                {
                  "pull": 0, "push": 0, "size": "md", "width": 4, "offset": 0, "currentWidth": 4,
                  "components": [
                    { "key": "bankAccount_confidence", "type": "textfield", "input": true, "label": "Bank Account — Confidence", "hidden": true, "tableView": false },
                    { "key": "bankAccount", "type": "textfield", "input": true, "label": "Bank Account", "prefix": "<i class='fa fa-android'></i>", "tableView": true }
                  ]
                },
                {
                  "size": "md", "width": 4, "currentWidth": 4,
                  "components": [
                    { "key": "bankCountry_confidence", "type": "textfield", "input": true, "label": "Bank Country — Confidence", "hidden": true, "tableView": false },
                    { "key": "bankCountry", "type": "textfield", "input": true, "label": "Bank Country", "prefix": "<i class='fa fa-android'></i>", "tableView": true }

        {

          "type": "panel",

          "title": "<strong>✍️ Vendor Declaration & Acknowledgment</strong>",
          "tableView": false,
          "components": [
            {
              "key": "declarationCheckbox",
              "mask": false,
              "type": "checkbox",
              "input": true,
              "label": "I hereby confirm that the information provided is correct and I agree to the Deutsche Telekom Supplier Code of Conduct and Data Privacy requirements.",

    // 2. Recherchierte Daten der Noris Werbung GmbH (noriswerbung.de / Handelsregister Fürth)
    const norisWerbungData = {
      name: "Noris Werbung GmbH",
      name_confidence: "0.98",

      searchAlias: "NORIS WERBUNG",
      searchAlias_confidence: "0.75", // Gelb: abgeleiteter Suchbegriff

      address: "Hafenstraße",
      address_confidence: "0.97",

      houseNo: "37",
      houseNo_confidence: "0.97",

      postalCode: "90768",
      postalCode_confidence: "0.99",

      city: "Fürth",
      city_confidence: "0.99",

      country: "Germany",
      country_confidence: "0.99",

      phone: "+49 911 9712757",
      phone_confidence: "0.96",

      email: "service@noriswerbung.de",
      email_confidence: "0.98",

      vatId: "",
      vatId_confidence: "0.62", // Gelb: Im Impressum nicht aufgeführt, bitte prüfen

      crNo: "HRB 7843",
      crNo_confidence: "0.95",

      taxnumber: "218/133/70198",
      taxnumber_confidence: "0.96",

      registerAddress: "Amtsgericht Fürth, Hafenstraße 37, 90768 Fürth",
      registerAddress_confidence: "0.88",

      legalForm: "GmbH",
      legalForm_confidence: "0.99",

      // Bankdaten sind öffentlich nicht im Impressum hinterlegt -> Rot (< 0.50) zur manuellen Ergänzung
      iban: "",
      iban_confidence: "0.20",

      accountHolder: "Noris Werbung GmbH",
      accountHolder_confidence: "0.85",

      bankCode: "",
      bankCode_confidence: "0.25",

      bankAccount: "",
      bankAccount_confidence: "0.25",

      bankCountry: "Germany",
      bankCountry_confidence: "0.90"
    };

    // 3. Form.io initialisieren & Daten injizieren
    Formio.createForm(document.getElementById("formio"), {
      components: [
        containerComponent,
        {
          type: "button",
          action: "submit",
          label: "Submit Review",
          theme: "primary"
        }
      ]
    }).then(function (form) {
      form.submission = {
        data: {
          container: norisWerbungData
        }
      };

      // Falls hiddenStyleHelper wegen hidden:true beim Initial-Render übersprungen wird,
      // werten wir das Custom-Conditional direkt mit aus:
      const helper = form.getComponent("hiddenStyleHelper");
      if (helper && helper.component && helper.component.customConditional) {
        const fn = new Function("data", "row", helper.component.customConditional);
        fn(form.submission.data, norisWerbungData);
      }

      form.on("submit", function (submission) {
        const out = document.getElementById("submission-output");
        out.style.display = "block";
        out.textContent = JSON.stringify(submission.data, null, 2);
      });
    });

</body>
</html>
